name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Parent targets 17, but control-flow-statements requires 21.
        # Building on 21 honors `maven.compiler.release=17` in the parent,
        # so both "normal" modules and the 21+ modules compile.
        java: [ '21' ]

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show Java & Maven versions
        run: |
          java -version
          mvn -version

      - name: Build & run tests
        # -B batch mode, -ntp no transfer progress, -U force update of snapshots
        run: mvn -B -ntp -U clean verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: 'false'

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-jdk${{ matrix.java }}
          path: '**/target/failsafe-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7